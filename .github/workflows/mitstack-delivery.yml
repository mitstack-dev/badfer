# Managed by mitstack — do not edit by hand (regenerated on every scaffold run).
# Mirrors this push's delivery status (build -> gates -> deploy -> healthy) by
# polling the mitstack-cicd dispatcher. See docs/guides/web-app-on-aws.md.
name: mitstack-delivery
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  MITSTACK_APP_ID: app_badfer_7b6e5873
  MITSTACK_DELIVERY_URL_BASE: 

jobs:
  follow-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Mint a GitHub Actions OIDC token and poll mitstack delivery status
        run: |
          set -euo pipefail

          oidc_token="$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mitstack-cicd-dispatcher" | jq -r '.value')"

          url="${MITSTACK_DELIVERY_URL_BASE}/delivery/${MITSTACK_APP_ID}/${{ github.sha }}"
          last_phase=""
          deadline=$(( $(date +%s) + 1800 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            resp="$(curl -sf -H "Authorization: Bearer ${oidc_token}" "$url" || true)"
            phase="$(printf '%s' "$resp" | jq -r '.phase // empty')"

            if [ -n "$phase" ] && [ "$phase" != "$last_phase" ]; then
              case "$phase" in
                building)      echo "mitstack delivery: building the image..." ;;
                gates-failed)  echo "mitstack delivery: quality gates FAILED" ;;
                deploying)     echo "mitstack delivery: gates passed, deploying..." ;;
                healthy)       echo "mitstack delivery: deployed and healthy" ;;
                rolled-back)   echo "mitstack delivery: deploy failed health check, rolled back" ;;
                *)             echo "mitstack delivery: phase=${phase}" ;;
              esac
              last_phase="$phase"
            fi

            case "$phase" in
              healthy) exit 0 ;;
              gates-failed|rolled-back) exit 1 ;;
            esac

            sleep 15
          done

          echo "mitstack delivery: timed out waiting for a terminal phase (last phase: ${last_phase:-unknown})"
          exit 1

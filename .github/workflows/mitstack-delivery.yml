# Managed by mitstack — regenerated on every scaffold run.
# Mirrors this push's delivery status (build -> gates -> deploy -> healthy) by
# polling the mitstack-cicd dispatcher. See docs/guides/web-app-on-aws.md.
#
# LOCAL PATCH (see README "CI"): the generated file ships
# MITSTACK_DELIVERY_URL_BASE empty, so the poll URL is "/delivery/..." with no
# host, curl never connects, and every push goes red after the full 30 min
# timeout. The base URL now comes from the repo variable
# MITSTACK_DELIVERY_URL_BASE (same lambda the companion badfer-ci repo calls via
# vars.MITSTACK_DISPATCH_URL). If a scaffold run regenerates this file, re-apply
# the three marked blocks below — the repo variable itself survives.
name: mitstack-delivery
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  MITSTACK_APP_ID: app_badfer_7b6e5873
  # PATCH 1/3 — was: MITSTACK_DELIVERY_URL_BASE: (empty)
  MITSTACK_DELIVERY_URL_BASE: ${{ vars.MITSTACK_DELIVERY_URL_BASE }}

jobs:
  follow-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Mint a GitHub Actions OIDC token and poll mitstack delivery status
        run: |
          set -euo pipefail

          # PATCH 2/3 — never burn a 30 min red on a missing dispatcher URL.
          if [ -z "${MITSTACK_DELIVERY_URL_BASE}" ]; then
            echo "::warning title=mitstack delivery not followed::Repo variable MITSTACK_DELIVERY_URL_BASE is unset, so there is no dispatcher to poll. Set it with: gh variable set MITSTACK_DELIVERY_URL_BASE -R ${{ github.repository }} --body <dispatcher-url>. The image build itself still ran in ${{ github.repository }}-ci."
            exit 0
          fi

          oidc_token="$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mitstack-cicd-dispatcher" | jq -r '.value')"

          url="${MITSTACK_DELIVERY_URL_BASE}/delivery/${MITSTACK_APP_ID}/${{ github.sha }}"
          last_phase=""
          contacted=0
          deadline=$(( $(date +%s) + 1800 ))
          # PATCH 3/3 — if the dispatcher never answers at all, that is a mitstack
          # config problem rather than a bad app build: say so and stop early
          # instead of polling a dead host for half an hour.
          contact_deadline=$(( $(date +%s) + 180 ))

          while [ "$(date +%s)" -lt "$deadline" ]; do
            resp="$(curl -sf -H "Authorization: Bearer ${oidc_token}" "$url" || true)"
            phase="$(printf '%s' "$resp" | jq -r '.phase // empty')"

            if [ -n "$phase" ]; then
              contacted=1
            elif [ "$contacted" -eq 0 ] && [ "$(date +%s)" -ge "$contact_deadline" ]; then
              echo "::warning title=mitstack delivery not followed::No response from the dispatcher at ${MITSTACK_DELIVERY_URL_BASE} after 3 min — check that MITSTACK_DELIVERY_URL_BASE and MITSTACK_APP_ID are current. The image build itself still ran in ${{ github.repository }}-ci."
              exit 0
            fi

            if [ -n "$phase" ] && [ "$phase" != "$last_phase" ]; then
              case "$phase" in
                building)      echo "mitstack delivery: building the image..." ;;
                gates-failed)  echo "mitstack delivery: quality gates FAILED" ;;
                deploying)     echo "mitstack delivery: gates passed, deploying..." ;;
                healthy)       echo "mitstack delivery: deployed and healthy" ;;
                rolled-back)   echo "mitstack delivery: deploy failed health check, rolled back" ;;
                *)             echo "mitstack delivery: phase=${phase}" ;;
              esac
              last_phase="$phase"
            fi

            case "$phase" in
              healthy) exit 0 ;;
              gates-failed|rolled-back) exit 1 ;;
            esac

            sleep 15
          done

          echo "mitstack delivery: timed out waiting for a terminal phase (last phase: ${last_phase:-unknown})"
          exit 1
